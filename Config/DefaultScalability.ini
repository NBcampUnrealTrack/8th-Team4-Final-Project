; UE 5.7 Landscape streaming workaround: avoid runtime material-quality switches.
; 2 = Medium. Other scalability values continue to use the existing configuration.
; Merge these keys into matching sections if this file already exists.

[EffectsQuality@0]
r.MaterialQualityLevel=2

[EffectsQuality@1]
r.MaterialQualityLevel=2

[EffectsQuality@2]
r.MaterialQualityLevel=2

[EffectsQuality@3]
r.MaterialQualityLevel=2

[EffectsQuality@Cine]
r.MaterialQualityLevel=2
